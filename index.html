<title>한누리 유럽 거점 최적화 최종</title>

<style>
/* Layout: 상단 결론 헤더 → 탭 → 한 열 분석 본문. 동박(copper) 강조색, 흑연(graphite) 중성색, 숫자는 고정폭. */
:root {
  --bg: #f2f4f5; --surface: #ffffff; --sunken: #e8ecee; --line: #d3dadd; --fg: #182127; --muted: #57656d;
  --accent: #a9531f; --accent-soft: #f3e2d6; --s2: #2c6b79; --s3: #7d8a92;
  --pos: #1d7447; --neg: #b02a20; --warn: #8a6100;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161a; --surface: #172026; --sunken: #1d282f; --line: #2b3840; --fg: #e4eaed; --muted: #98a6ae;
  --accent: #e08c58; --accent-soft: #3a2a20; --s2: #6db1c1; --s3: #8e9ba3; --pos: #5cbf88; --neg: #ef7b70; --warn: #ddb44c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10161a; --surface: #172026; --sunken: #1d282f; --line: #2b3840; --fg: #e4eaed; --muted: #98a6ae;
  --accent: #e08c58; --accent-soft: #3a2a20; --s2: #6db1c1; --s3: #8e9ba3; --pos: #5cbf88; --neg: #ef7b70; --warn: #ddb44c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.6; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.45rem, 3.2vw, 2.05rem); line-height: 1.3; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.22rem; line-height: 1.4; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; max-width: 72ch; }
.eyebrow { font-family: var(--f-data); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.num, td.n, th.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid var(--fg); }
.top .brand { display: grid; gap: 6px; min-width: 0; }
.status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-data); font-size: 0.8rem; color: var(--muted); }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
.status.ok .dot { background: var(--pos); }
.status.err .dot { background: var(--neg); }
.progress { height: 3px; background: var(--sunken); margin-top: 8px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }

.tabs { display: flex; gap: 2px; overflow-x: auto; margin: 14px 0 22px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-size: 0.92rem; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 9px 13px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stack { display: grid; gap: 22px; }
.section { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }

.answer { display: grid; grid-template-columns: 2.6rem 1fr; gap: 4px 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.answer:first-child { border-top: 0; }
.answer .k { font-family: var(--f-data); font-size: 0.8rem; color: var(--accent); padding-top: 3px; }
.answer h3 { margin-bottom: 4px; }
.answer ul { margin: 6px 0 0; padding-left: 1.1rem; display: grid; gap: 3px; }

.verdict { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; display: grid; gap: 6px; }
.verdict strong { font-size: 1.08rem; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-data); font-size: 1.3rem; font-weight: 500; }
.kpi .l { font-size: 0.8rem; color: var(--muted); }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { background: var(--sunken); font-weight: 600; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--accent-soft); }
.cell-pos { color: var(--pos); }
.cell-neg { color: var(--neg); }
td.heat { position: relative; }
.rule { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.pos { color: var(--pos); } .chip.neg { color: var(--neg); } .chip.warn { color: var(--warn); } .chip.acc { color: var(--accent); }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 20px; }
fieldset { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0; display: grid; gap: 6px; min-width: 0; }
legend { font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
label { display: flex; align-items: center; gap: 7px; font-size: 0.9rem; }
input[type="number"], select { font: inherit; font-family: var(--f-data); font-size: 0.88rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
input[type="number"] { width: 5.2rem; }
.probs { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px 10px; }
.probs label { justify-content: space-between; }
button.btn { font: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 4px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn:disabled { opacity: .5; cursor: wait; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }

.note { font-size: 0.84rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; max-width: 80ch; }
.note.warn { border-left-color: var(--warn); }
.finding { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; }
.finding p { max-width: 90ch; }

svg text { fill: var(--muted); font-family: var(--f-data); font-size: 11px; }
svg .axis { stroke: var(--line); }
svg .zero { stroke: var(--fg); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); font-family: var(--f-data); font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
pre.formula { font-family: var(--f-data); font-size: 0.82rem; background: var(--sunken); padding: 12px 14px; border-radius: var(--r); overflow-x: auto; margin: 0; line-height: 1.55; }
@media (max-width: 560px) { .answer { grid-template-columns: 1fr; } th, td { padding: 6px 8px; } }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }

</style>
</head>

      (cc ? '<div class="section"><h2>독립 구현 교차검증 (빌드 시점)</h2><p>Python + HiGHS로 Excel을 직접 읽는 별도 구현(tools/reference_model.py)과 이 엔진을 정책 공간 전체에서 비교했습니다.</p><div class="kpis">' +
        kpi(fmt(cc.yearlyLPs), '비교한 연도별 LP') + kpi(Number(cc.maxLpObjectiveDiff).toExponential(1), 'LP 최적값 최대 차이') + kpi(cc.npvExactMatches + ' / ' + cc.plans, '증분 NPV 완전 일치(&lt;1e-6)') + kpi(fmt(cc.maxNpvDiffUsdMillion, 2), '동률 최적해 최대 NPV 차이') + '</div>' +
        '<p class="note">불일치 ' + cc.alternativeOptimaTies.length + '건은 모두 기존 브로츠와프와 브로츠와프 증설을 함께 쓰는 조합입니다. 같은 부지라 레인 비용이 같아 세전 최적 배정이 여러 개이고, 어느 공장에 물량을 둘지에 따라 공장별 세금이 달라집니다. 이 조합은 어떤 기준에서도 상위 정책이 아니어서 결론에 영향이 없습니다. 검증 시각 ' + esc(VER.checkedAt) + '.</p></div>' : '') +
      '<details class="panel"><summary>자료 14 증분 NPV 40개 상세</summary>' + table(['후보 / 미래', '자료 14', '계산', '일치'], inc.map(function (r) { return [esc(r.item), sgn(r.ref), sgn(r.got, 2), r.ok ? chip('일치', 'pos') : chip('차이', 'neg')]; }), { num: [1, 2] }) + '</details></div>';
  }
  function findings() {
    var F = [
      ['pos', '정확', '데이터·원가·탄소·재무 엔진', 'Excel 5개 시트(지문 5b0f7bd1ea71), 단위 변환, 자료 11 도착원가(86.40·86.24), 자료 13 단독 NPV 8개, 자료 14 무투자 5개·증분 40개를 독립 구현 두 개(Python+HiGHS, 이 엔진)로 재현했습니다. v1·v2 값과 소수 둘째 자리까지 같습니다. 브로츠와프 2027년 88GWh 보간 해석도 재현으로 뒷받침됩니다.'],
      ['pos', '정확', '배포본 = 소스', '두 공개 사이트의 engine.js·data.json·app.js 등이 로컬 소스와 SHA-256 단위로 같고, 공개 사이트의 엔진을 브라우저에서 직접 실행해도 같은 값이 나옵니다.'],
      ['neg', '수정', '기다림의 가치를 계산하지 않음', '사례 질문 5(d)와 CFO 발언은 2028년까지 위임법·IAA·헝가리 정책이 확인된다는 전제에서 지금 확정과 결정 유예를 비교하라고 합니다. v1은 ‘지금 2년 늦춘 일정으로 확정’(학습 없음)만 비교했고 v2는 이를 계산하지 않았다고 명시했습니다. 학습 후 결정을 넣으면 순위가 달라집니다(전략 최적화 탭).'],
      ['neg', '수정', 'v2 결론이 임의 예시값에 좌우됨', 'v2의 ‘무투자/집행 보류’는 분석자가 정한 예시값에서 나왔습니다. 데브레첸에만 보조금 −50%·1년 지연·가공비 +10%를 모두 주고, 다른 후보는 일부만, 오스트라바·브로츠와프 증설은 0으로 두었습니다. 입력을 어떻게 정하느냐가 순위를 정합니다. v3는 결론이 뒤집히는 허용한계를 계산합니다(데브레첸 가공비 약 +4.9%, CAPEX 약 +9.9%).'],
      ['neg', '수정', '탄소 헤지의 가치를 평가하지 않음', 'v1은 VW 레인 하나의 필요 저탄소 전력 비율만 표시했습니다. 모든 EU 레인 기준 필요 비율과, 상한 미래에서 그 헤지의 NPV(신규 공장보다 훨씬 큼)를 비교해야 질문 3·권고 (iv)에 답할 수 있습니다.'],
      ['warn', '보완', '2번째 거점과 정량 트리거', '사례 표는 신규 공장 1곳 추가를 계산했을 뿐 제약은 아닙니다. 상한 미래에서는 데브레첸 + 사라고사(2029) 조합이 단일 최선보다 큽니다. v2는 정량 트리거를 산정하지 않았습니다. v3는 수요·비용·확률 전환점을 계산합니다.'],
      ['warn', '보완', '동률 최적 배정', '사례의 세전 공헌이익 배정 규칙은 같은 부지 두 공장(기존 브로츠와프+증설)의 물량 분할을 정하지 못해 세후 NPV가 최대 약 1.3백만 달러 달라질 수 있습니다. 결론에는 영향이 없고 검증에서 별도로 표시합니다.'],
      ['warn', '보완', '실행 환경', 'v1·v2는 HiGHS WASM 때문에 로컬 웹서버가 필요합니다. v3는 자체 simplex(최적성 증명 포함)로 단일 HTML 파일을 더블클릭해 실행됩니다.'],
      ['neg', '최종 수정', '수요 상방 미래가 없음', '사례의 다섯 미래 중 수요 시나리오는 둔화뿐이었습니다. 최종 버전은 수요 둔화(성장률 ×0.5)와 대칭인 ‘수요 가속’(성장률 ×K, 기본 1.5) 미래를 넣고, 2번째 공장이 이익이 되는 성장률 배수(수요 상방 전환점)를 계산합니다. 끄면 v3와 같은 결과입니다.'],
      ['neg', '최종 수정', '부분정보 대응을 기대값으로만 선택', 'v3는 정보집합에 미래가 여러 개 묶일 때 대응을 조건부 기대값으로 고른 뒤 최대후회로 순위를 매겼습니다. 최종 버전은 최대후회 기준이면 정보집합 안의 최대후회를 직접 최소화합니다(정보집합별 분해가 정확). 각 20%의 다섯 미래에서는 결과가 같고, 확률이 치우치거나 수요 가속을 넣은 ‘정책만 확인’에서 달라집니다.'],
      ['warn', '최종 보완', '결정 시점의 공장 수', 'v3의 대기 정책은 결정 시점에 공장 1곳만 착공할 수 있었습니다. 최종 버전은 2곳 동시 착공을 선택으로 제공합니다(기본 꺼짐: 제출본 수치와 같게 유지).']
    ];
    return '<div class="panel">' + F.map(function (f) { return '<div class="finding">' + chip(f[1], f[0]) + '<div><h3>' + f[2] + '</h3><p class="small">' + f[3] + '</p></div></div>'; }).join('') + '</div>';
  }

  /* ---------- 탭: 모형 정의 ---------- */
  function viewModel() {
    return '<div class="stack"><div class="section"><h2>두 단계 의사결정 모형</h2>' +
      '<pre class="formula">집합   I 공장(기존 2 + 선택 후보), J OEM 21, T 2026..2045, S 미래 6(사례 5 + 수요 가속), K 후보 8\n' +
      '1단계  a ∈ {대기} ∪ K           2026.12 이사회: 즉시 착공(CAPEX 2027~) 여부\n' +
      '2단계  b(I_s) ∈ {없음, k′@L, 헤지, 헤지+k′@L (, k′+k″@L)}   L년 말 정보집합 I_s를 보고 선택(CAPEX L+1~)\n' +
      '배정   x_ijts ≥ 0  (GWh)  매년·매 미래 LP:\n' +
      '       max Σ_ij (p_jt − c_ijt) x_ijt\n' +
      '       s.t. Σ_j x_ijt ≤ Cap_it(a,b)          공장 능력·램프업·가동 전 0\n' +
      '            Σ_i x_ijt ≤ 0.70 · D_jt          OEM별 한누리 수주 상한\n' +
      '            x_ijt = 0  (상한 미래 EU 레인 위치기반 셀+운송 > 65/60kg)\n' +
      '현금흐름 CF_it = (Σ_j m_ijt x_ijt − F_it) − max(0, τ_i(EBITDA_it − Dep_it)) − CAPEX_it + 보조금_it\n' +
      '평가    V(a,b,s) = Σ_t Σ_i CF_its/(1.09)^(t−2026) − V(무투자, s)\n' +
      '정책값  π(a,s) = V(a, b*(I_s), s)\n' +
      '        기대값 기준 b*(I) = argmax_b Σ_{s∈I} P_s V(a,b,s)\n' +
      '        최대후회 기준 b*(I) = argmin_b max_{s∈I} [H_s − V(a,b,s)],  H_s = max_{a′,b′} V(a′,b′,s)\n' +
      '기준    기대값 Σ_s P_s π(a,s)  |  최대후회 max_s [H_s − π(a,s)]\n' +
      '수요    D_jts = D_j0 (1+k_s g1_j)^min(t,4) (1+k_s g2_j)^max(0,t−4),  k = 0.5(둔화) · K(가속) · 1(그 외)</pre>' +
      '<p>투자 결정은 이산 공간(대기·후보 8곳 × 2단계 행동: 대기 9개·착공 후 8개, 직접전력 포함 시 18·16개, 2곳 동시 착공 허용 시 최대 74개, 고정 일정 정책 포함)을 <strong>완전열거</strong>하므로 주어진 기준에 대해 전역 최적입니다. 배정은 연도별 LP를 자체 simplex로 풀고 쌍대해로 최적성을 확인합니다. 연도 사이 재고·결손 이월이 없어 연도별 분해가 정확합니다.</p></div>' +
      '<div class="section"><h2>사례 규칙(자료 6~10·14, 그대로 유지)</h2><pre class="formula">소재비 50 × 추세_t / 수율   추세: 2030년까지 −1.5%/년, 이후 −0.5%/년 (판매가 동일)\n' +
      '가공비 가공비_i × (1−1%)^min(t−2026, 9)       전력비 38.8 × 전력단가_i\n' +
      '운송·하역 레인 원자료(하역 포함)               관세 판매가 × 관세율\n' +
      '재고비 12% × (리드타임+7)/365 × (소재비+가공비)\n' +
      'CBAM 한국→EU: 내재배출 × 25%(고탄소 2030~ 100%) × 탄소가격 × 1.10/1000\n' +
      '고탄소 EU 판매가 −(시장기반 셀+운송 − 50) × 탄소가격 × 1.10/1000\n' +
      '위치기반 셀 = 시장기반 + 38.8 × 전력망계수 × 재생비중 (− 38.8 × 전력망계수 × 직접전력 비율)\n' +
      '역내 요건 2030~ 한국→EU +6 USD/kWh      수요 둔화 성장률 × 0.5   수요 가속(분석 확장) 성장률 × K\n' +
      '고정비 +1.5%/년, 신규는 램프 비율(최소 60%)   감가상각 순CAPEX/10년(가동 첫해부터)\n' +
      '세금 공장별 max(0, 세율 × (EBITDA − 감가상각))   WACC 9%, 2026년 t=0, 잔존가치 0\n' +
      '기존 브로츠와프 86 → 88 → 90GWh (2026 → 2027 → 2028~)</pre></div>' +
      '<div class="section"><h2>해석의 경계</h2><p class="note">2단계 정보 가정은 사례(CFO 발언·질문 5d)의 전제를 모형화한 것이며, 결정 시점에 어떤 미래인지 완전히 안다는 가정과 수요는 모른다는 가정을 모두 제공합니다. 대기 기간의 준비 비용, 직접 전력 헤지의 실제 비용, 후보지 정성 위험은 자료에 수치가 없어 손익분기로 제시합니다. 수요 가속 미래는 사례에 없는 분석 확장이며, 여섯 미래 밖의 위험은 다루지 않습니다.</p></div></div>';
  }

  /* ---------- 렌더링 ---------- */
  function renderStatus() {
    var el = document.getElementById('status'); if (!el) return;
    el.className = 'status ' + (S.error ? 'err' : S.busy ? '' : S.R ? 'ok' : '');
    document.getElementById('status-text').textContent = S.error ? '오류: ' + S.error : S.busy ? '계산 중' : S.R ? '최적화 완료 · 사례 재현 ' + S.val.passed + '/' + S.val.total : '대기';
  }
  function render() {
    var nav = document.getElementById('tabs');
    nav.innerHTML = TABS.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('');
    var v = document.getElementById('view');
    if (S.error) { v.innerHTML = '<div class="panel"><h2>계산을 마치지 못했습니다</h2><p>' + esc(S.error) + '</p><p class="small">입력값을 확인한 뒤 ‘전략 최적화’ 탭에서 다시 계산하세요.</p></div>'; return; }
    if (!S.R || !S.val) { v.innerHTML = S.tab === 'strategy' ? viewStrategy() : '<div class="panel"><h2>20년 공급망을 최적화하는 중입니다</h2><p>기본 설정에서 투자안×미래 486개의 연도별 공급배정 LP 9,720개를 풀고, 이어서 허용한계·강건성을 계산합니다. 보통 10~20초 걸립니다.</p></div>'; return; }
    v.innerHTML = { answer: viewAnswer, strategy: viewStrategy, tolerance: viewTolerance, hedge: viewHedge, ops: viewOps, verify: viewVerify, model: viewModel }[S.tab]();
  }
  function readControls() {
    var g = function (id) { return document.getElementById(id); };
    var learn = document.querySelector('input[name="learn"]:checked'), info = document.querySelector('input[name="info"]:checked');
    if (learn) S.opt.learnYear = +learn.value; if (info) S.opt.info = info.value;
    if (g('second')) S.opt.secondSite = g('second').checked;
    if (g('pairs')) S.opt.pairsAtL = g('pairs').checked;
    if (g('fastinc')) S.opt.includeFast = g('fastinc').checked;
    if (g('fastk')) S.opt.fastK = Math.min(3, Math.max(1.05, +g('fastk').value || 1.5));
    if (g('hedge')) S.opt.hedge.enabled = g('hedge').checked;
    if (g('hshare')) S.opt.hedge.share = Math.min(0.8, Math.max(0.05, (+g('hshare').value || 35) / 100));
    if (g('hprem')) S.opt.premium = Math.max(0, +g('hprem').value || 0);
    E.SC_IDS.forEach(function (k) { var el = g('p-' + k); if (el) S.opt.probs[k] = Math.max(0, +el.value || 0); });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) { S.tab = t.getAttribute('data-tab'); try { localStorage.setItem('hanuri-final-tab', S.tab); } catch (x) { /* 무시 */ } render(); return; }
    if (e.target.id === 'run') {
      readControls();
      var sum = activeSC().reduce(function (a, k) { return a + S.opt.probs[k]; }, 0);
      if (!(sum > 0)) { S.error = '미래별 확률의 합이 0입니다. 하나 이상에 양수를 넣으세요.'; render(); S.error = null; return; }
      recompute(); return;
    }
    if (e.target.id === 'risk-run') {
      var g = function (id) { return Math.max(0, +document.getElementById(id).value || 0); };
      S.risk = { sub: Math.min(100, g('r-sub')), permit: Math.min(5, Math.round(g('r-permit'))), proc: Math.min(50, g('r-proc')), capex: Math.min(150, g('r-capex')) };
      applyRisk();
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'crit') { S.criterion = e.target.value; S.opsPolicy = winner().id; render(); }
    if (e.target.id === 'tolsite') { S.tolSite = e.target.value; S.riskOut = null; S.tol = E.tolerance(M, S.tolSite, 0, 'base', engineOpt().cfg, 0); S.tolLate = S.tolSite === DEB ? S.demLate : demandBreakeven(S.tolSite); render(); }
    if (e.target.id === 'opspol') { S.opsPolicy = e.target.value; render(); }
    if (e.target.id === 'opssc') { S.opsSc = e.target.value; render(); }
  });
  document.getElementById('meta').textContent = 'DATA ' + HANURI_DATA.meta.fingerprint + ' · ENGINE ' + E.VERSION + ' · 화면 ' + APP_VERSION + ' · 원자료 ' + HANURI_DATA.meta.sourceFile;
  window.__hanuri = { S: S, render: render, recompute: recompute };
  render(); recompute();
})();

</script>
